[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safi-rca"
version = "0.1.0"
description = "Trainable, read-only, repo-aware root cause analyzer for one git repository at one exact sha"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

# The analyzer core is standard library only, so it installs anywhere.  The two
# optional extras are the integrations the architecture is built on:
#   repomap  -> Aider's RepoMap (tiered map of the exported tree)
#   agent    -> the OpenHands agent runtime
# Both degrade gracefully when absent: the report says which producer ran.
#
# Note: aider-chat 0.16 pins openai==0.27.6 while openhands-sdk needs
# openai>=2.20, so pip reports a conflict.  Both still work -- safi_rca's
# openai_compat shim restores the one module attribute Aider's RepoMap needs.
# See README "Environment notes".
[project.optional-dependencies]
repomap = ["aider-chat>=0.16,<0.17"]
agent = ["openhands-sdk>=1.50"]
test = ["pytest>=8"]

[project.scripts]
safi-rca = "safi_rca.cli:main"

[tool.setuptools]
packages = ["safi_rca", "safi_rca.runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
